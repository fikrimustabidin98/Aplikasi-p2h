<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2H Alat Berat Lengkap</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: auto; }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;}
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer;}
    .btn-sync { background: #007bff; }
    .btn-hapus { background: #dc3545; padding: 5px; width: auto; font-size: 12px;}
    .btn-edit { background: #ffc107; color: black; padding: 5px; width: auto; font-size: 12px;}
    .data-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    #list-data { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Form P2H (Tambah & Edit)</h2>
  
  <!-- Input tersembunyi untuk menyimpan ID saat mode Edit -->
  <input type="hidden" id="edit-id" value="">

  <label>Nama Operator:</label>
  <input type="text" id="operator">
  
  <label>Kode Unit:</label>
  <input type="text" id="unit">

  <label>Status:</label>
  <select id="status">
    <option>Ready to Use</option>
    <option>Breakdown</option>
  </select>

  <label>Catatan:</label>
  <textarea id="catatan"></textarea>

  <button id="btn-submit" onclick="simpanAtauEdit()">Submit Data Baru</button>
  <button class="btn-sync" onclick="bacaDataServer()">Lihat Data dari Server (Online)</button>

  <div id="list-data"></div>

  <script>
    // GANTI DENGAN URL WEB APP ANDA YANG BARU
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx0psCB7xnXEoN0x_S6ea24Vr8ZQX-Nj2lxfn_qeXZpfFHBHaE_MUDOcve0vvcsfbeG-Q/exec';

    function simpanAtauEdit() {
      const idEdit = document.getElementById('edit-id').value;
      
      const payload = {
        operator: document.getElementById('operator').value,
        unit: document.getElementById('unit').value,
        status: document.getElementById('status').value,
        catatan: document.getElementById('catatan').value
      };

      if (!navigator.onLine) {
        alert("Anda sedang Offline. Edit/Hapus tidak bisa dilakukan. Data baru disimpan di HP.");
        // Logika offline khusus tambah data (sama seperti sebelumnya)
        let dataTersimpan = JSON.parse(localStorage.getItem('p2hData')) || [];
        dataTersimpan.push(payload);
        localStorage.setItem('p2hData', JSON.stringify(dataTersimpan));
        kosongkanForm();
        return;
      }

      document.getElementById('btn-submit').innerText = "Memproses...";

      // Tentukan apakah ini Tambah Baru atau Edit Data Lama
      let requestBody = {};
      if (idEdit === "") {
        requestBody = { action: "tambah", data: [payload] };
      } else {
        requestBody = { action: "edit", id: idEdit, ...payload };
      }

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestBody)
      })
      .then(res => res.json())
      .then(result => {
        alert(idEdit === "" ? "Data berhasil ditambah!" : "Data berhasil diedit!");
        kosongkanForm();
        bacaDataServer(); // Langsung perbarui tabel
      });
    }

    function bacaDataServer() {
      if (!navigator.onLine) return alert("Harus terhubung internet untuk melihat data.");
      document.getElementById('list-data').innerHTML = "Memuat data dari server...";

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "baca" })
      })
      .then(res => res.json())
      .then(result => {
        let html = "<h3>Daftar Data P2H:</h3>";
        result.data.forEach(item => {
          html += `
            <div class="data-card">
              <strong>${item.unit}</strong> - ${item.operator} (${item.status})<br>
              <small>${item.catatan}</small><br><br>
              <button class="btn-edit" onclick="siapkanEdit('${item.id}', '${item.operator}', '${item.unit}', '${item.status}', '${item.catatan}')">Edit</button>
              <button class="btn-hapus" onclick="hapusData('${item.id}')">Hapus</button>
            </div>
          `;
        });
        document.getElementById('list-data').innerHTML = html;
      });
    }

    function siapkanEdit(id, operator, unit, status, catatan) {
      document.getElementById('edit-id').value = id;
      document.getElementById('operator').value = operator;
      document.getElementById('unit').value = unit;
      document.getElementById('status').value = status;
      document.getElementById('catatan').value = catatan;
      document.getElementById('btn-submit').innerText = "Update Data (Edit)";
      window.scrollTo(0, 0); // Gulir layar ke atas
    }

    function hapusData(id) {
      if(!confirm("Yakin ingin menghapus data ini?")) return;
      
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "hapus", id: id })
      })
      .then(res => res.json())
      .then(result => {
        alert("Data dihapus!");
        bacaDataServer(); // Perbarui tabel
      });
    }

    function kosongkanForm() {
      document.getElementById('edit-id').value = "";
      document.getElementById('operator').value = "";
      document.getElementById('unit').value = "";
      document.getElementById('catatan').value = "";
      document.getElementById('btn-submit').innerText = "Submit Data Baru";
    }
  </script>
</body>
</html>
