<!DOCTYPE html>
<html lang="id">
<head>

  <style>
    :root { 
      --primary: #fbbc04; --primary-dark: #f0a300;
      --bg: #f4f6f9; --card: #ffffff; 
      --text: #202124; --border: #dadce0; --dark-gray: #343a40;
      --normal: #ceead6; --normal-text: #0d652d;
      --abnormal: #fad2cf; --abnormal-text: #a50e0e;
    }
    
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding: 0; margin: 0; }
    .container { max-width: 600px; margin: auto; padding: 15px; }
    
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid var(--border);}
    .header-card { border-top: 8px solid var(--dark-gray); display:flex; justify-content:space-between; align-items:center;}
    h1, h2 { margin: 0 0 10px 0; color: var(--dark-gray); }
    .title-field { font-weight: 600; margin-bottom: 10px; font-size: 15px;}
    .title-field span { color: #d93025; }
    
    input[type="text"], input[type="password"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 14px;}
    input[readonly] { background-color: #e8eaed; font-weight: bold; color: #5f6368; outline: none;}
    
    .action-btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s;}
    .action-btn:active { transform: scale(0.98); }
    .btn-mining { background: var(--primary); color: #000; } 
    .btn-green { background: #34a853; color: white;} 
    .btn-orange { background: #f29900; color: white;} 
    .btn-blue { background: #1a73e8; color: white;} 
    .btn-gray { background: #5f6368; color: white; width: auto; padding: 10px;}
    
    .radio-group, .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .radio-item, .checkbox-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; cursor: pointer;}
    input[type="radio"], input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--dark-gray);}
    
    .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; text-align: center; margin-bottom:10px;}
    .online { background: #ceead6; color: #0d652d; } .offline { background: #fad2cf; color: #a50e0e; }
    
    .view-section { display: none; } 
    .view-active { display: block; }
    
    .login-wrapper { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1578885136359-16c8bee4d81e?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;}
    #view-login.view-active { display: flex; } 
    .login-box { background: rgba(255, 255, 255, 0.95); padding: 30px 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-top: 8px solid var(--primary); }
    .login-logo { width: 160px; margin-bottom: 15px; object-fit: contain; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;}
    .menu-btn { background: #fff; border: 2px solid var(--dark-gray); padding: 25px 10px; border-radius: 8px; font-weight: bold; font-size: 15px; text-align: center; cursor: pointer; color: var(--dark-gray); transition: 0.2s;}
    .menu-btn:active { background: var(--primary); border-color: var(--primary); color: #000;}

    .search-box { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;}
    .search-box > * { flex: 1; min-width: 140px;}
    .data-item { border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; background: white; border-left: 5px solid var(--primary);}
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    .btn-edit { background: var(--bg); color: #000; padding: 8px; border: 1px solid var(--border); border-radius: 4px; flex: 1; font-weight:bold; cursor: pointer;}
    .btn-hapus { background: #ea4335; color: white; padding: 8px; border: none; border-radius: 4px; flex: 1; font-weight:bold; cursor: pointer;}

    .checklist-container { border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #f8f9fa; }
    .checklist-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; line-height: 1.4;}
    .toggle-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid #ccc; margin-bottom: 5px;}
    .toggle-btn { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; background: white; border: none; transition: 0.2s; }
    .toggle-btn.active-normal { background: var(--normal); color: var(--normal-text); }
    .toggle-btn.active-abnormal { background: var(--abnormal); color: var(--abnormal-text); }
    .toggle-btn:not(:last-child) { border-right: 1px solid #ccc; }
    .detail-box { display: none; margin-top: 8px; }
    .detail-box.show { display: block; }
    
    details { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border: 1px solid #e0e0e0; }
    summary { font-weight: bold; cursor: pointer; color: var(--dark-gray); }
    .hasil-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; line-height: 1.6;}
    
    .smu-block { background:#f4f6f9; padding:15px; border-radius:6px; margin-bottom:15px; border: 1px solid #e0e0e0; display:none; }
  </style>
</head>

  <div id="view-login" class="view-section view-active login-wrapper">

        <div class="detail-box" id="box-${id}">

  function setToggle(kategori, itemNama, status, idUI) {
    if(kategori === 'p1') formStateP1[itemNama].status = status;
    else formStateP2[itemNama].status = status;
    document.getElementById(`btn-norm-${idUI}`).classList.remove('active-normal');
    document.getElementById(`btn-abn-${idUI}`).classList.remove('active-abnormal');
    if (status === 'Normal') {
      document.getElementById(`btn-norm-${idUI}`).classList.add('active-normal');
      document.getElementById(`box-${idUI}`).classList.remove('show');
      document.getElementById(`txt-${idUI}`).value = "";
      if(kategori === 'p1') formStateP1[itemNama].detail = ""; else formStateP2[itemNama].detail = "";
    } else {
      document.getElementById(`btn-abn-${idUI}`).classList.add('active-abnormal');
      document.getElementById(`box-${idUI}`).classList.add('show');
    }
  }

  function simpanDetail(kategori, itemNama, isiText) {
    if(kategori === 'p1') formStateP1[itemNama].detail = isiText;
    else formStateP2[itemNama].detail = isiText;
  }

  function terapkanStateEdit(kategori, dataTersimpan) {
    const isP1 = (kategori === 'p1');
    const stateObj = isP1 ? formStateP1 : formStateP2;
    const config = checklistData[currentJenisAlat][kategori];

    config.forEach((item, index) => {
      const id = `${kategori}-${index}`;
      if(dataTersimpan[item] && dataTersimpan[item].status !== "") {
        setToggle(kategori, item, dataTersimpan[item].status, id);
        if(dataTersimpan[item].detail) {
           document.getElementById(`txt-${id}`).value = dataTersimpan[item].detail;
           stateObj[item].detail = dataTersimpan[item].detail;
        }
      }
    });
  }

  function cekValidasiChecklist() {
    for (let key in formStateP1) { if(formStateP1[key].status === "") return false; }
    for (let key in formStateP2) { if(formStateP2[key].status === "") return false; }
    return true;
  }

  window.onload = () => {
    updateOnlineStatus();
    const savedUser = localStorage.getItem('p2h_user');
    if (savedUser) { currentUser = JSON.parse(savedUser); masukKeMenuUtama(); }
  };

  function prosesLogin() {
    const pin = document.getElementById('pin-input').value;
    if (!pin) return alert("Masukkan PIN!");
    if (!navigator.onLine) return alert("Anda sedang offline. Butuh internet untuk login pertama kali.");
    const btn = document.getElementById('btn-login'); btn.innerText = "MENCOCOKKAN..."; btn.disabled = true;

    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "login", pin: pin }) })
    .then(res => res.json()).then(res => {
      if (res.status === "sukses") {
        currentUser = { nama: res.nama, role: res.role, pin: pin }; 
        localStorage.setItem('p2h_user', JSON.stringify(currentUser)); masukKeMenuUtama();
      } else { alert(res.pesan); document.getElementById('pin-input').value = ""; }
    }).finally(() => { btn.innerText = "MASUK APLIKASI"; btn.disabled = false; });
  }

  function masukKeMenuUtama() {
    document.querySelectorAll('.role-badge-display').forEach(el => el.innerText = `👤 ${currentUser.nama} (${currentUser.role})`);
    document.getElementById('pin-input').value = "";
    document.getElementById('nama-karyawan').value = currentUser.nama; 
    document.getElementById('sn').value = currentUser.pin; 
    gantiLayar('view-menu'); window.scrollTo(0,0);

  function getRadio(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ""; }
  function setRadio(name, val) { document.querySelectorAll(`input[name="${name}"]`).forEach(el => el.checked = false); if(val) { const el = document.querySelector(`input[name="${name}"][value="${val}"]`); if(el) el.checked = true; } }

  function simpanAtauEdit() {
    const idEdit = document.getElementById('edit-id').value;
    if(!cekValidasiChecklist()) return alert("Gagal: Mohon selesaikan pemeriksaan P1 & P2!");

    let payload = {
      jenisAlat: currentJenisAlat, tanggal: document.getElementById('tanggal').value,
      idUnit: document.getElementById('id-unit').value.toUpperCase(),
      namaKaryawan: document.getElementById('nama-karyawan').value, sn: document.getElementById('sn').value,
      shift: getRadio('shift'), statusUnit: getRadio('status'),
      p1: formStateP1, p2: formStateP2
    };

    // Validasi penangkapan nilai SMU Dinamis
    if (currentJenisAlat === 'DOZER') {
       if(!document.getElementById('chk-gen').checked && !document.getElementById('chk-rip').checked) return alert("Silakan pilih jenis pekerjaan (General/Ripping)!");
       if(document.getElementById('chk-gen').checked) { payload.smuGenMulai = document.getElementById('smu-gen-m').value; payload.smuGenSelesai = document.getElementById('smu-gen-s').value; if(!payload.smuGenMulai) return alert("Isi SMU Awal General!"); }
       if(document.getElementById('chk-rip').checked) { payload.smuRipMulai = document.getElementById('smu-rip-m').value; payload.smuRipSelesai = document.getElementById('smu-rip-s').value; if(!payload.smuRipMulai) return alert("Isi SMU Awal Ripping!"); }
    } else if (currentJenisAlat === 'EXCAVATOR') {
       if(!document.getElementById('chk-gen').checked && !document.getElementById('chk-load').checked) return alert("Silakan pilih jenis pekerjaan (General/Loading)!");
       if(document.getElementById('chk-gen').checked) { payload.smuGenMulai = document.getElementById('smu-gen-m').value; payload.smuGenSelesai = document.getElementById('smu-gen-s').value; if(!payload.smuGenMulai) return alert("Isi SMU Awal General!"); }
       if(document.getElementById('chk-load').checked) { payload.smuLoadMulai = document.getElementById('smu-load-m').value; payload.smuLoadSelesai = document.getElementById('smu-load-s').value; if(!payload.smuLoadMulai) return alert("Isi SMU Awal Loading!"); }
    } else if (currentJenisAlat === 'WT') {
       payload.smuMulai = document.getElementById('smu-std-m').value; payload.smuSelesai = document.getElementById('smu-std-s').value;
       payload.ritaseTandon = document.getElementById('ritase-t').value; payload.ritasePit = document.getElementById('ritase-p').value;
       if(!payload.smuMulai) return alert("Isi SMU Awal!");
    } else {
       payload.smuMulai = document.getElementById('smu-std-m').value; payload.smuSelesai = document.getElementById('smu-std-s').value;
       if(!payload.smuMulai) return alert("Isi SMU Awal!");
    }

    if(!payload.tanggal || !payload.idUnit || !payload.shift || !payload.statusUnit) return alert("Lengkapi data dasar unit bertanda (*)");

    if(!navigator.onLine) {
      if(idEdit !== "") return alert("Peringatan: Tidak bisa mengedit data server saat offline.");
      let saved = JSON.parse(localStorage.getItem('p2hData')) || []; saved.push(payload); localStorage.setItem('p2hData', JSON.stringify(saved));
      alert("Tersimpan Offline! Klik tombol 'Kirim Data Offline' setelah sinyal kembali.");
      kosongkanForm(); cekDataOffline(); gantiLayar('view-menu'); return;
    }

    const btn = document.getElementById('btn-submit'); btn.innerText = "Mengirim..."; btn.disabled = true;
    let requestBody = idEdit === "" ? { action: "tambah", data: [payload] } : { action: "edit", id: idEdit, ...payload };

    fetch(GAS_URL, { method: 'POST', body: JSON.stringify(requestBody) }).then(res => res.json()).then(() => { 
      alert("Tersimpan ke Server!"); 
      if(idEdit !== "") { if(asalLayarData === "view-menu") bacaSemuaDataServer(); else bacaDataServer(); } else { kosongkanForm(); gantiLayar('view-menu'); }
    }).finally(() => { btn.innerText = "KIRIM FORMULIR P2H"; btn.disabled = false; });
  }

  function resetFilter() {
    document.getElementById('search-input').value = ""; document.getElementById('filter-tanggal').value = ""; document.getElementById('filter-status').value = "ALL";
    if (asalLayarData === "view-menu") document.getElementById('filter-unit').value = "ALL";
    filterTabel();
  }

  function bacaDataServer() {
    if(!navigator.onLine) return alert("Gagal: Butuh internet!"); asalLayarData = "view-form"; gantiLayar('view-data');
    document.getElementById('judul-riwayat').innerText = `Riwayat P2H ${currentJenisAlat}`; document.getElementById('list-data').innerHTML = "<p style='text-align:center; color:gray;'>Mengambil data...</p>";
    document.getElementById('filter-unit').value = currentJenisAlat; document.getElementById('filter-unit').disabled = true; document.getElementById('filter-unit').style.backgroundColor = "#e8eaed";
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "baca", jenisAlat: currentJenisAlat }) }).then(res => res.json()).then(res => { dataRiwayat = res.data.reverse(); filterTabel(); });
  }

  function bacaSemuaDataServer() {
    if(!navigator.onLine) return alert("Gagal: Butuh internet!"); asalLayarData = "view-menu"; gantiLayar('view-data');
    document.getElementById('judul-riwayat').innerText = `Semua Riwayat P2H`; document.getElementById('list-data').innerHTML = "<p style='text-align:center; color:gray;'>Mengambil seluruh data...</p>";
    document.getElementById('filter-unit').disabled = false; document.getElementById('filter-unit').style.backgroundColor = "#fff"; resetFilter();
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "baca", jenisAlat: "SEMUA" }) }).then(res => res.json()).then(res => { dataRiwayat = res.data.reverse(); filterTabel(); });
  }

  function renderHasilTampilan(dataObj) {
    let resultHTML = ""; let adaMasalah = false; let parsedData = (typeof dataObj === 'string') ? JSON.parse(dataObj) : dataObj;
    for (let key in parsedData) {
      if(parsedData[key].status === 'Tidak Normal') {
        adaMasalah = true; resultHTML += `<div style="margin-bottom:8px; border-left:3px solid #d93025; padding-left:10px;"><div style="font-weight:bold; font-size:13px; color:#d93025;">${key}</div><div style="color:#555; font-size:12px; margin-top:3px;">Catatan: <i>${parsedData[key].detail || '-'}</i></div></div>`;
      }
    }
    return !adaMasalah ? `<div style="color:gray; font-size:13px;">✅ Normal</div>` : resultHTML;
  }
  
  function renderSMURiwayat(item) {
      let dt = item.dataTambahan || {};
      let txt = "";
      if (item.jenisAlat === 'DOZER') {
          if (dt.smuGenMulai) txt += `<b>[Gen]</b> SMU: ${dt.smuGenMulai} s/d ${dt.smuGenSelesai||'?'} (Tot: <b>${dt.totalGen} Jam</b>)<br>`;
          if (dt.smuRipMulai) txt += `<b>[Rip]</b> SMU: ${dt.smuRipMulai} s/d ${dt.smuRipSelesai||'?'} (Tot: <b>${dt.totalRip} Jam</b>)<br>`;
      } else if (item.jenisAlat === 'EXCAVATOR') {
          if (dt.smuGenMulai) txt += `<b>[Gen]</b> SMU: ${dt.smuGenMulai} s/d ${dt.smuGenSelesai||'?'} (Tot: <b>${dt.totalGen} Jam</b>)<br>`;
          if (dt.smuLoadMulai) txt += `<b>[Load]</b> SMU: ${dt.smuLoadMulai} s/d ${dt.smuLoadSelesai||'?'} (Tot: <b>${dt.totalLoad} Jam</b>)<br>`;
      } else if (item.jenisAlat === 'WT') {
          txt += `SMU: ${dt.smuMulai||'-'} s/d ${dt.smuSelesai||'?'} (Tot: <b>${dt.totalSmu} Jam</b>)<br>`;
          txt += `Ritase Tandon: <b>${dt.ritaseTandon||0}</b> | Ritase Pit: <b>${dt.ritasePit||0}</b><br>`;
      } else {
          txt += `SMU: ${dt.smuMulai||'-'} s/d ${dt.smuSelesai||'?'} (Tot: <b>${dt.totalSmu} Jam</b>)<br>`;
      }
      return txt || "Belum ada data SMU";
  }

  function filterTabel() {
    const searchTxt = document.getElementById('search-input').value.toLowerCase();
    const filterStat = document.getElementById('filter-status').value;
    const filterUnit = document.getElementById('filter-unit').value;
    const filterTgl = document.getElementById('filter-tanggal').value; 
    const box = document.getElementById('list-data'); let html = "";
    const LIMIT_48_JAM = 48 * 60 * 60 * 1000; const wktSekarang = new Date().getTime();
    
    dataRiwayat.forEach(item => {
      const tglItem = item.tanggal.split('T')[0]; 
      if ((item.idUnit.toLowerCase().includes(searchTxt) || item.namaKaryawan.toLowerCase().includes(searchTxt)) && (filterStat === "ALL" || item.statusUnit.includes(filterStat)) && (filterUnit === "ALL" || item.jenisAlat === filterUnit) && (!filterTgl || tglItem === filterTgl)) {
        
        let bisaEdit = (currentUser.role === 'Admin') || ((wktSekarang - parseInt(item.waktuIsiEpoch || wktSekarang)) <= LIMIT_48_JAM && item.sn.toString() === currentUser.pin.toString());
        let btnEditHTML = bisaEdit ? `<button class="btn-edit" onclick="siapkanEdit('${encodeURIComponent(JSON.stringify(item))}')">Edit Form</button>` : `<button class="btn-edit" style="background:#eee; color:#aaa;" disabled>Terkunci</button>`;
        let btnHapusHTML = currentUser.role === 'Admin' ? `<button class="btn-hapus" onclick="hapusData('${item.id}', '${item.jenisAlat}')">Hapus</button>` : '';
        const warnaStatus = item.statusUnit.includes('Tidak') ? '#d93025' : '#0d652d';
        
        html += `
          <div class="data-item">
            <div style="font-weight:bold; color:var(--dark-gray); font-size:16px; margin-bottom:5px;"><span style="color:var(--primary-dark); margin-right:5px;">[${item.jenisAlat}]</span>${item.idUnit} <span style="float:right; color:${warnaStatus}; font-size:13px;">${item.statusUnit}</span></div>
            <div style="font-size:13px; color:#5f6368; line-height:1.6; margin-bottom:10px;">
              Tgl: ${tglItem} | Shift: ${item.shift} | Opr: ${item.namaKaryawan} (SN: ${item.sn})<br>
              <div style="background:#f1f3f4; padding:8px; border-radius:4px; margin-top:5px; line-height:1.8;">
                ${renderSMURiwayat(item)}
              </div>
            </div>
            <details><summary>Lihat Hasil Ceklis P2H</summary><div class="hasil-box">
                <div style="font-weight:bold; border-bottom:1px solid #ccc; padding-bottom:5px;">⚠️ Temuan P1:</div>${renderHasilTampilan(item.p1)}
                <div style="font-weight:bold; margin-top:15px; border-bottom:1px solid #ccc; padding-bottom:5px;">⚠️ Temuan P2:</div>${renderHasilTampilan(item.p2)}
            </div></details>
            <div class="btn-group">${btnEditHTML}${btnHapusHTML}</div>
          </div>`;
      }
    });
    box.innerHTML = html || "<p style='text-align:center; color:gray;'>Tidak ada data yang cocok.</p>";
  }

  function siapkanEdit(dataStr) {
    const item = JSON.parse(decodeURIComponent(dataStr)); currentJenisAlat = item.jenisAlat; 
    renderChecklist(currentJenisAlat); generateSmuUI(currentJenisAlat); 
    
    terapkanStateEdit('p1', (typeof item.p1 === 'string') ? JSON.parse(item.p1) : item.p1);
    terapkanStateEdit('p2', (typeof item.p2 === 'string') ? JSON.parse(item.p2) : item.p2);

    document.getElementById('judul-form').innerText = `Edit P2H ${currentJenisAlat}`; document.getElementById('edit-id').value = item.id;
    document.getElementById('tanggal').value = item.tanggal.split('T')[0]; document.getElementById('id-unit').value = item.idUnit;
    setRadio('shift', item.shift); setRadio('status', item.statusUnit);
    
    // Terapkan SMU Dinamis ke Form Edit
    let dt = item.dataTambahan || {};
    if (currentJenisAlat === 'DOZER') {
        if(dt.smuGenMulai){ document.getElementById('chk-gen').click(); document.getElementById('smu-gen-m').value = dt.smuGenMulai; document.getElementById('smu-gen-s').value = dt.smuGenSelesai||''; }
        if(dt.smuRipMulai){ document.getElementById('chk-rip').click(); document.getElementById('smu-rip-m').value = dt.smuRipMulai; document.getElementById('smu-rip-s').value = dt.smuRipSelesai||''; }
    } else if (currentJenisAlat === 'EXCAVATOR') {
        if(dt.smuGenMulai){ document.getElementById('chk-gen').click(); document.getElementById('smu-gen-m').value = dt.smuGenMulai; document.getElementById('smu-gen-s').value = dt.smuGenSelesai||''; }
        if(dt.smuLoadMulai){ document.getElementById('chk-load').click(); document.getElementById('smu-load-m').value = dt.smuLoadMulai; document.getElementById('smu-load-s').value = dt.smuLoadSelesai||''; }
    } else if (currentJenisAlat === 'WT') {
        document.getElementById('smu-std-m').value = dt.smuMulai||''; document.getElementById('smu-std-s').value = dt.smuSelesai||'';
        document.getElementById('ritase-t').value = dt.ritaseTandon||''; document.getElementById('ritase-p').value = dt.ritasePit||'';
    } else {
        document.getElementById('smu-std-m').value = dt.smuMulai||''; document.getElementById('smu-std-s').value = dt.smuSelesai||'';
    }
    
    gantiLayar('view-form'); window.scrollTo(0,0);
  }

  function hapusData(id, jenisAlatTarget) {
    if(!confirm("Yakin hapus data ini secara permanen?")) return;
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "hapus", id: id, jenisAlat: jenisAlatTarget }) })
    .then(res => res.json()).then(() => { if (asalLayarData === "view-menu") bacaSemuaDataServer(); else bacaDataServer(); });
  }

  function cekDataOffline() { let saved = JSON.parse(localStorage.getItem('p2hData')) || []; const btn = document.getElementById('btn-sync-offline'); if (saved.length > 0 && navigator.onLine && currentUser) { btn.style.display = 'block'; btn.innerText = `🔄 Kirim Data Offline (${saved.length})`; } else { btn.style.display = 'none'; } }
  function sinkronisasiOffline() { let saved = JSON.parse(localStorage.getItem('p2hData')) || []; const btn = document.getElementById('btn-sync-offline'); btn.innerText = "Mengirim..."; btn.disabled = true; fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "tambah", data: saved }) }).then(res => res.json()).then(() => { alert("Seluruh data tertunda terkirim ke Server!"); localStorage.removeItem('p2hData'); cekDataOffline(); }).finally(() => btn.disabled = false); }
  function kosongkanForm() { document.getElementById('edit-id').value = ""; document.getElementById('id-unit').value = ""; setRadio('shift', ""); setRadio('status', ""); }
  function gantiLayar(idLayar) { document.querySelectorAll('.view-section').forEach(el => el.classList.remove('view-active')); document.getElementById(idLayar).classList.add('view-active'); }
</script>
</body>
</html>
